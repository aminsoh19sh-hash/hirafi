details[open] p{animation:fq .35s ease}
@keyframes fq{from{opacity:0;transform:translateY(-6px)}}
.faq-empty{text-align:center;color:var(--mut);display:none;padding:20px}

<script>const s=document.getElementById('splash');if(sessionStorage.sp){s.remove()}else{sessionStorage.sp=1;setTimeout(()=>s.classList.add('hide'),1500)}</script>
<script>
(()=>{
const ds=[...document.querySelectorAll('#faq details')],no=document.getElementById('faqNo');
document.getElementById('faqQ').addEventListener('input',e=>{const v=e.target.value.trim().toLowerCase();let n=0;ds.forEach(d=>{const m=d.textContent.toLowerCase().includes(v);d.style.display=m?'':'none';if(m)n++});no.style.display=n?'none':'block'});
ds.forEach(d=>d.addEventListener('toggle',()=>{if(d.open)ds.forEach(o=>{if(o!==d)o.open=false})}));
})();
